<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phantom AI Billion Dollar Engine Interface</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Phantom AI Billion Dollar Engine</h1>

    <div class="container">
        <h2>Collect Wallet</h2>
        <label for="walletAddress" class="input-label">Wallet Address <span class="required">*</span></label>
        <div class="input-group">
            <input type="text" id="walletAddress" placeholder="Enter Wallet Address" aria-required="true">
            <button id="collectWalletBtn">Register Wallet</button>
        </div>
        <div id="collectWalletResult" class="result-area"></div>
    </div>

    <div class="container">
        <h2>System Status</h2>
        <div class="input-group" style="align-items: center;">
            <button id="getStatusBtn">Get System Status</button>
            <label class="auto-refresh-label">
                <input type="checkbox" id="autoRefreshCheckbox" aria-label="Auto-refresh system status every 3 seconds">
                <span>Auto-Refresh (3s)</span>
                <span class="refresh-indicator" aria-hidden="true"></span>
            </label>
        </div>
        <div id="systemStatusResult" class="result-area">
            <h3>Registered Wallets:</h3>
            <ul id="walletsList"></ul>
            <h3>Wallet Scaling Factors:</h3>
            <pre id="scalingFactorsData"></pre>
            <h3>Wallet Strategies:</h3>
            <pre id="strategiesData"></pre>
            <!-- Profit events in status might be too verbose, focusing on above for now -->
        </div>
    </div>

    <div class="container">
        <h2>Profit Events</h2>
        <label for="profitWalletAddress" class="input-label">Wallet Address <span class="required">*</span></label>
        <div class="input-group">
            <input type="text" id="profitWalletAddress" placeholder="Enter Wallet for Profits" aria-required="true">
            <button id="getProfitEventsBtn">Get Profit Events</button>
        </div>
        <div id="profitEventsResult" class="result-area"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
